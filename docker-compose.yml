services:
  postgres:
    image: postgres:17
    container_name: kanvra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanvra}
      POSTGRES_USER: ${POSTGRES_USER:-kanvra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kanvra_dev}
    ports:
      - "5432:5432"
    volumes:
      - kanvra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kanvra} -d ${POSTGRES_DB:-kanvra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: kanvra-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Dual-listener setup (code-review fix): INTERNAL is used by in-network
      # containers (kafka-ui), EXTERNAL by host-side clients (the Spring Boot
      # app on localhost). A single advertised listener breaks one side.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kanvra-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Spring Boot backend (TECH_DOC §21/§27): health-gated startup so Flyway
  # migrations and Kafka consumers only run once Postgres/Kafka are ready.
  backend:
    build: ./backend
    container_name: kanvra-backend
    restart: unless-stopped
    environment:
      KANVRA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kanvra}
      KANVRA_DB_USERNAME: ${POSTGRES_USER:-kanvra}
      KANVRA_DB_PASSWORD: ${POSTGRES_PASSWORD:-kanvra_dev}
      KANVRA_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KANVRA_JWT_SECRET: ${KANVRA_JWT_SECRET:-dev-only-change-me-in-prod-base64-secret}
      KANVRA_CORS_ORIGINS: ${KANVRA_CORS_ORIGINS:-http://localhost:3000}
      KANVRA_COOKIES_SECURE: ${KANVRA_COOKIES_SECURE:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  kanvra-postgres-data:
