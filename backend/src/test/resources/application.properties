# Test-scoped override: integration tests (AuthFlowIntegrationTest) fire many
# /api/v1/auth requests from a single MockMvc client IP, which would trip the
# per-client auth rate limiter (default 5/min) and turn otherwise-correct
# assertions into 429s. The limiter itself is covered by AuthRateLimiterTest,
# and the 429 HTTP path by RateLimitIntegrationTest (which overrides this via
# @TestPropertySource), so it is raised here for @SpringBootTest runs.
kanvra.auth.rate-limit-per-minute=1000
