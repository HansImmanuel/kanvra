spring.application.name=kanvra-backend

# --- DataSource ---
spring.datasource.url=${KANVRA_DB_URL:jdbc:postgresql://localhost:5432/kanvra}
spring.datasource.username=${KANVRA_DB_USERNAME:kanvra}
spring.datasource.password=${KANVRA_DB_PASSWORD:kanvra_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Flyway ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Kafka ---
# EXTERNAL advertised listener of the docker-compose Kafka (host-side access).
spring.kafka.bootstrap-servers=${KANVRA_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Kanvra application settings ---
kanvra.jwt.secret=${KANVRA_JWT_SECRET:dev-only-change-me-in-prod-base64-secret}
kanvra.jwt.access-token-ttl=PT30M
kanvra.jwt.refresh-token-ttl=P7D
kanvra.cors.origins=${KANVRA_CORS_ORIGINS:http://localhost:3000}
kanvra.auth.rate-limit-per-minute=5
# Comma-separated allowlist of trusted reverse-proxy addresses. X-Forwarded-For
# is ONLY honored for requests originating from these addresses (empty = never).
kanvra.auth.trusted-proxies=${KANVRA_TRUSTED_PROXIES:}
# Cookies are NOT flagged Secure in local dev (http). Set to true in production behind HTTPS.
kanvra.cookies.secure=false
