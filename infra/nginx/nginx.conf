worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream kanvra_frontend {
        server frontend:3000;
    }

    upstream kanvra_backend {
        server backend:8080;
    }

    server {
        listen 80;

        # REST API -> Spring Boot. Proxied on the same origin so the httpOnly
        # session cookies attach without any CORS/cross-site considerations.
        location /api/ {
            proxy_pass http://kanvra_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 2m;
        }

        # WebSocket/STOMP -> Spring Boot (HTTP upgrade handshake, long-lived).
        location /ws {
            proxy_pass http://kanvra_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else -> Next.js (App Router pages + static assets).
        location / {
            proxy_pass http://kanvra_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}